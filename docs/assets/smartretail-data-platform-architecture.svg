<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b7a53"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .h1{font-size:43px;font-weight:800}
      .h2{font-size:19px;font-weight:500;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;filter:url(#shadow)}
      .bt{font-size:22px;font-weight:800}
      .bs{font-size:15px;fill:#475569}
      .small{font-size:14px;fill:#475569}
      .chip{font-size:14px;font-weight:700}
      .section{font-size:18px;font-weight:800}
      .arrowB{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#arrowBlue)}
      .arrowG{stroke:#059669;stroke-width:5;fill:none;marker-end:url(#arrowGreen)}
      .dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="105" fill="url(#header)"/>
  <text x="800" y="48" text-anchor="middle" class="t h1" fill="#ffffff">SmartRetail Data Platform</text>
  <text x="800" y="79" text-anchor="middle" class="t h2" fill="#dbeafe">Big Data + IA para vendas, clientes e estoque em tempo real</text>

  <!-- Sources -->
  <rect x="24" y="145" width="225" height="530" class="box" stroke="#93c5fd"/>
  <text x="136" y="180" text-anchor="middle" class="t section">Fontes de dados</text>
  <g class="t">
    <rect x="43" y="205" width="187" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="59" y="232" class="bt" font-size="17">Web / Mobile</text><text x="59" y="257" class="small">e-commerce e canais digitais</text>
    <rect x="43" y="295" width="187" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="59" y="322" class="bt" font-size="17">Lojas / PDV</text><text x="59" y="347" class="small">vendas e estoque</text>
    <rect x="43" y="385" width="187" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="59" y="412" class="bt" font-size="17">Sensores IoT</text><text x="59" y="437" class="small">prateleiras e ambiente</text>
    <rect x="43" y="475" width="187" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="59" y="502" class="bt" font-size="17">APIs</text><text x="59" y="527" class="small">sistemas e parceiros</text>
    <rect x="43" y="565" width="187" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="59" y="592" class="bt" font-size="17">Logs</text><text x="59" y="617" class="small">apps, infra e segurança</text>
  </g>

  <!-- Spring -->
  <rect x="300" y="286" width="205" height="180" class="box" stroke="#86efac"/>
  <circle cx="402" cy="329" r="25" fill="#16a34a"/>
  <text x="402" y="337" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="white">S</text>
  <text x="402" y="381" text-anchor="middle" class="t bt">Spring Boot API</text>
  <text x="402" y="406" text-anchor="middle" class="t bs">Java 21</text>
  <rect x="323" y="423" width="158" height="28" rx="9" fill="#dcfce7"/>
  <text x="402" y="442" text-anchor="middle" class="t chip">Ingestão + validação</text>

  <!-- Kafka -->
  <rect x="555" y="286" width="205" height="180" class="box" stroke="#c4b5fd"/>
  <circle cx="657" cy="329" r="25" fill="#111827"/>
  <text x="657" y="337" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="white">K</text>
  <text x="657" y="381" text-anchor="middle" class="t bt">Apache Kafka</text>
  <text x="657" y="406" text-anchor="middle" class="t bs">Event Streaming</text>
  <rect x="578" y="423" width="158" height="28" rx="9" fill="#ede9fe"/>
  <text x="657" y="442" text-anchor="middle" class="t chip">eventos em tempo real</text>

  <!-- Spark -->
  <rect x="825" y="148" width="230" height="170" class="box" stroke="#93c5fd"/>
  <text x="940" y="194" text-anchor="middle" class="t bt">Spark Structured</text>
  <text x="940" y="222" text-anchor="middle" class="t bt">Streaming</text>
  <text x="940" y="254" text-anchor="middle" class="t bs">processamento em tempo real</text>
  <rect x="856" y="270" width="168" height="28" rx="9" fill="#dbeafe"/>
  <text x="940" y="289" text-anchor="middle" class="t chip">Velocity</text>

  <!-- realtime analytics -->
  <rect x="1110" y="148" width="245" height="170" class="box" stroke="#86efac"/>
  <text x="1232" y="188" text-anchor="middle" class="t bt">Analytics em tempo real</text>
  <text x="1143" y="225" class="t small">• vendas/min</text>
  <text x="1143" y="250" class="t small">• ticket médio</text>
  <text x="1143" y="275" class="t small">• top produtos</text>
  <text x="1143" y="300" class="t small">• estoque crítico</text>

  <!-- Data Lake -->
  <rect x="795" y="407" width="260" height="245" class="box" stroke="#f59e0b"/>
  <text x="925" y="445" text-anchor="middle" class="t bt">Data Lake / Lakehouse</text>
  <text x="925" y="470" text-anchor="middle" class="t bs">MinIO / S3 + Apache Iceberg</text>
  <rect x="825" y="495" width="200" height="42" rx="10" fill="#ffedd5" stroke="#fdba74"/>
  <text x="925" y="522" text-anchor="middle" class="t chip">Bronze — dados brutos</text>
  <rect x="825" y="548" width="200" height="42" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="925" y="575" text-anchor="middle" class="t chip">Silver — dados tratados</text>
  <rect x="825" y="601" width="200" height="42" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="925" y="628" text-anchor="middle" class="t chip">Gold — dados analíticos</text>

  <!-- Airflow -->
  <rect x="1110" y="358" width="245" height="105" class="box" stroke="#67e8f9"/>
  <text x="1232" y="398" text-anchor="middle" class="t bt">Apache Airflow</text>
  <text x="1232" y="427" text-anchor="middle" class="t bs">orquestração de pipelines</text>

  <!-- PySpark -->
  <rect x="1110" y="500" width="220" height="152" class="box" stroke="#86efac"/>
  <text x="1220" y="541" text-anchor="middle" class="t bt">PySpark</text>
  <text x="1220" y="570" text-anchor="middle" class="t bs">ETL + Data Quality</text>
  <text x="1220" y="596" text-anchor="middle" class="t small">limpeza • deduplicação</text>
  <text x="1220" y="620" text-anchor="middle" class="t small">enriquecimento • regras</text>

  <!-- ML -->
  <rect x="1380" y="358" width="195" height="140" class="box" stroke="#c4b5fd"/>
  <text x="1477" y="397" text-anchor="middle" class="t bt">MLflow + ML</text>
  <text x="1477" y="427" text-anchor="middle" class="t small">previsão de demanda</text>
  <text x="1477" y="453" text-anchor="middle" class="t small">detecção de anomalias</text>

  <!-- Serving -->
  <rect x="1380" y="525" width="195" height="127" class="box" stroke="#93c5fd"/>
  <text x="1477" y="565" text-anchor="middle" class="t bt">Serving Layer</text>
  <text x="1477" y="594" text-anchor="middle" class="t small">PostgreSQL + API</text>
  <text x="1477" y="619" text-anchor="middle" class="t small">Dashboard React</text>

  <!-- arrows -->
  <path d="M249 375 L300 375" class="arrowB"/>
  <path d="M505 375 L555 375" class="arrowB"/>
  <path d="M760 350 C790 350 790 233 825 233" class="arrowB"/>
  <path d="M1055 233 L1110 233" class="arrowB"/>
  <path d="M760 400 C790 400 780 525 795 525" class="arrowG"/>
  <path d="M1055 575 L1110 575" class="arrowG"/>
  <path d="M1330 575 C1350 575 1350 428 1380 428" class="arrowG"/>
  <path d="M1477 498 L1477 525" class="arrowG"/>
  <path d="M1232 463 L1232 500" class="dash"/>

  <!-- Footer platform -->
  <rect x="24" y="710" width="1552" height="155" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="748" class="t section">Infraestrutura, Observabilidade e Governança</text>
  <g class="t">
    <rect x="55" y="773" width="190" height="60" rx="12" fill="#eff6ff"/><text x="150" y="809" text-anchor="middle" class="chip">Docker + Compose</text>
    <rect x="260" y="773" width="190" height="60" rx="12" fill="#eff6ff"/><text x="355" y="809" text-anchor="middle" class="chip">Kubernetes</text>
    <rect x="465" y="773" width="190" height="60" rx="12" fill="#fff7ed"/><text x="560" y="809" text-anchor="middle" class="chip">Prometheus</text>
    <rect x="670" y="773" width="190" height="60" rx="12" fill="#fff7ed"/><text x="765" y="809" text-anchor="middle" class="chip">Grafana</text>
    <rect x="875" y="773" width="190" height="60" rx="12" fill="#f0fdf4"/><text x="970" y="809" text-anchor="middle" class="chip">OpenTelemetry</text>
    <rect x="1080" y="773" width="190" height="60" rx="12" fill="#fef2f2"/><text x="1175" y="809" text-anchor="middle" class="chip">Redis</text>
    <rect x="1285" y="773" width="260" height="60" rx="12" fill="#ecfdf5"/><text x="1415" y="799" text-anchor="middle" class="chip">5 Vs: Volume • Velocity</text><text x="1415" y="820" text-anchor="middle" class="small">Variety • Veracity • Value</text>
  </g>
</svg>