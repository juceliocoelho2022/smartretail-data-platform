services:
  postgres:
    image: postgres:17-alpine
    container_name: smartretail-postgres
    environment:
      POSTGRES_DB: smartretail
      POSTGRES_USER: smartretail
      POSTGRES_PASSWORD: smartretail
    ports:
      - "5433:5432"
    volumes:
      - smartretail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartretail -d smartretail"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: smartretail-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  ingestion-api:
    build:
      context: ./backend/ingestion-api
    container_name: smartretail-ingestion-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smartretail
      DB_USER: smartretail
      DB_PASSWORD: smartretail
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  spark-streaming:
    image: apache/spark:4.0.1-java21-python3
    container_name: smartretail-spark-streaming

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDERS_TOPIC: smartretail.orders.v1
      SPARK_APP_NAME: smartretail-orders-streaming
      CHECKPOINT_LOCATION: /opt/spark/work-dir/checkpoints/orders
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

    volumes:
      - ./streaming/spark-streaming/src:/opt/spark/work-dir/src:ro
      - ./streaming/spark-streaming/checkpoints:/opt/spark/work-dir/checkpoints

    ports:
      - "4040:4040"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - /opt/spark/work-dir/src/main/python/app.py

    depends_on:
      kafka:
        condition: service_started


  minio:
    image: minio/minio:latest
    container_name: smartretail-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartretail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartretail123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smartretail-minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: smartretail-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartretail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartretail123}
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set smartretail http://minio:9000 ${MINIO_ROOT_USER:-smartretail} ${MINIO_ROOT_PASSWORD:-smartretail123}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing smartretail/smartretail-bronze;
      mc mb --ignore-existing smartretail/smartretail-silver;
      mc mb --ignore-existing smartretail/smartretail-gold;
      mc mb --ignore-existing smartretail/smartretail-warehouse;
      echo 'SmartRetail Lakehouse buckets are ready.';
      "

volumes:
  smartretail-postgres-data:
  smartretail-minio-data:
