spring:

  application:
    name: smartretail-ingestion-api


  datasource:

    url:
      ${DB_URL:jdbc:postgresql://localhost:5433/smartretail}

    username:
      ${DB_USER:smartretail}

    password:
      ${DB_PASSWORD:smartretail}


  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:

      hibernate:

        jdbc:

          time_zone: UTC


  flyway:

    enabled: true


  kafka:

    bootstrap-servers:
      ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


    producer:

      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.springframework.kafka.support.serializer.JsonSerializer

      acks: all

      properties:

        enable.idempotence: true


    consumer:

      group-id:
        ${KAFKA_CONSUMER_GROUP:smartretail-order-projection-v1}

      auto-offset-reset:
        earliest

      enable-auto-commit:
        false

      key-deserializer:
        org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer:
        org.springframework.kafka.support.serializer.JsonDeserializer

      properties:

        spring.json.trusted.packages:
          com.smartretail.ingestion.event

        spring.json.use.type.headers:
          true


    listener:

      ack-mode: record


server:

  port:
    ${SERVER_PORT:8080}

  shutdown:
    graceful


app:

  kafka:

    topics:

      orders:
        ${ORDERS_TOPIC:smartretail.orders.v1}


  outbox:

    fixed-delay-ms:
      ${OUTBOX_FIXED_DELAY_MS:1000}


management:

  endpoints:

    web:

      exposure:

        include:
          health,info,metrics,prometheus


  endpoint:

    health:

      probes:

        enabled: true


  metrics:

    tags:

      application:
        ${spring.application.name}


logging:

  level:

    root:
      INFO

    com.smartretail:
      INFO
