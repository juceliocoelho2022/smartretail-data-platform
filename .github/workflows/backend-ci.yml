name: backend-ci

on:
  push:
    paths:
      - "backend/ingestion-api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/ingestion-api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ingestion-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B verify
