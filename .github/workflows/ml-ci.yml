name: ml-ci

on:
  push:
    paths:
      - "ml/**"
      - "backend/analytics-api/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    paths:
      - "ml/**"
      - "backend/analytics-api/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ml-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            streaming/spark-streaming/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streaming/spark-streaming/requirements.txt
          pip install -r ml/requirements.txt

      - name: Run ML tests
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          python -m unittest discover \
            -s ml/src/test/python \
            -p "test_*.py" \
            -v

      - name: Verify analytics API
        working-directory: backend/analytics-api
        run: mvn -B verify

      - name: Build ML jobs image
        run: docker build -t smartretail-ml-jobs:0.6 ./ml

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start MLflow infrastructure
        run: |
          docker compose up -d --wait --wait-timeout 180 \
            postgres minio mlflow
          curl --fail --silent --show-error \
            http://localhost:5000/health

      - name: Run ML materialization jobs
        run: |
          docker compose run --rm ml-history
          docker compose run --rm ml-product-demand
          docker compose run --rm ml-features

      - name: Train and validate demand champion
        run: |
          docker compose run --rm ml-train
          docker compose run --rm ml-register
          docker compose run --rm ml-validate-champion

      - name: Start analytics serving schema
        run: |
          docker compose up -d --wait --wait-timeout 180 analytics-api
          curl --fail --silent --show-error \
            http://localhost:8082/actuator/health

      - name: Generate and publish demand forecast
        run: |
          docker compose run --rm ml-forecast-generate
          docker compose run --rm ml-forecast-publish
          rows="$(docker compose exec -T postgres \
            psql -U smartretail -d smartretail -tAc \
            "SELECT COUNT(*) FROM analytics.demand_forecast;")"
          echo "Published forecast rows=${rows}"
          test "${rows}" = "210"

      - name: Show ML diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color \
            postgres minio mlflow-db-init mlflow analytics-api \
            spark-ivy-init || true

      - name: Stop ML infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
