name: ml-ci

on:
  push:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            streaming/spark-streaming/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streaming/spark-streaming/requirements.txt
          pip install -r ml/requirements.txt

      - name: Run ML tests
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          python -m unittest discover \
            -s ml/src/test/python \
            -p "test_*.py" \
            -v

      - name: Build ML jobs image
        run: docker build -t smartretail-ml-jobs:0.6 ./ml
